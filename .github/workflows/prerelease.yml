name: Prerelease

# Fast build for testing a branch on a real Mac: builds any branch, tag or
# commit, signs and notarizes it when the secrets exist, and publishes a
# GitHub prerelease named test-<shortsha> with the pkg, uninstall.sh and
# checksums. See docs/RELEASING.md.
#
#   gh workflow run prerelease.yml --ref my-branch          # build my-branch
#   gh workflow run prerelease.yml -f ref=my-branch         # same, from the default branch's workflow
#   git tag test-fix-hiss && git push origin test-fix-hiss  # build that commit as release test-fix-hiss
#
# The branch must contain this workflow and the scripts it calls, so merge
# main into it first. The pkg is published even when it could not be signed
# (the release notes say so); the real release workflow never does that.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build. Empty means the branch this was started from.
        type: string
        required: false
        default: ''
  push:
    tags: ['test-*']

permissions:
  contents: read

jobs:
  prepare:
    name: resolve ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Name the build
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          sha="$(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = push ]; then
            tag_name="$REF_NAME"
          else
            tag_name="test-$(git rev-parse --short=7 HEAD)"
          fi
          echo "Building $sha as $tag_name"
          {
            echo "tag_name=$tag_name"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.prepare.outputs.tag_name }}
      ref: ${{ needs.prepare.outputs.sha }}
      publish_unsigned: true
    secrets: inherit
