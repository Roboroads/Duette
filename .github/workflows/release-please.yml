name: release-please

# Opens and maintains the release PR. When that PR is merged, release-please
# tags vX.Y.Z and creates the GitHub release (a prerelease while the major
# version is 0), and the second job builds, signs and notarizes the installer
# and attaches it to that release.
#
# The build is called from here on purpose. A release created with
# GITHUB_TOKEN does not fire other workflows' release or tag events, so a
# separate "on: release" or "on: push: tags" workflow would never start.

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PR opened with GITHUB_TOKEN does not trigger pull_request
          # workflows, so ci.yml does not run on the release PR. Add a
          # personal access token (or GitHub App token) as the repo secret
          # RELEASE_PLEASE_TOKEN to change that. Without it, run ci.yml by
          # hand on the release branch. See docs/RELEASING.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
